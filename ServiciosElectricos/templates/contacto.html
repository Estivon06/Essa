{% extends 'base.html' %}
{% block title %}Contacto{% endblock %}
{% block content %}
<h2>Contacto</h2>
<form method="post">
    {% csrf_token %}
    <label>Nombre:</label><br>
    <input type="text" name="nombre"><br><br>
    <label>Mensaje:</label><br>
    <textarea name="mensaje"></textarea><br><br>
    <input type="submit" value="Enviar">
</form>
{% endblock %}
